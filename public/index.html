<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成型產線溫度監控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7684; --drop:#dc2626; --spike:#d97706; --border:#e3e6ea; --alert-bg:#fef2f2;
          --s0:#2563eb; --s1:#059669; --s2:#9333ea; --accent:#2563eb; --limit:#ef4444; --rest-bg:rgba(148,163,184,0.13); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8ecf1; --muted:#93a0b0; --drop:#f87171; --spike:#fbbf24; --border:#2b3440; --alert-bg:#2a1b1e;
            --s0:#60a5fa; --s1:#34d399; --s2:#c084fc; --accent:#3b82f6; --limit:#f87171; --rest-bg:rgba(148,163,184,0.12); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:8px 16px; }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  .head-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .status { font-size:.85rem; color:var(--muted); }
  .status.bad { color: var(--drop); font-weight:600; }
  .rules { font-size:.78rem; color:var(--muted); }
  .banner { display:none; margin-top:12px; padding:8px 12px; border-radius:8px; background:#fef3c7; color:#78350f; font-size:.9rem; }

  /* 上方異常訊息列：不連續滾動，改為每 7 秒平穩切換下一筆（或滑鼠移上暫停），也可點左右切換 */
  .ticker { display:flex; align-items:center; gap:10px; margin-top:12px; padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); overflow:hidden; }
  .ticker.has-alert { border-color:var(--drop); background:var(--alert-bg); }
  .ticker-badge { font-size:.78rem; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap; background:#e5e7eb; color:#374151; }
  .ticker.has-alert .ticker-badge { background:var(--drop); color:#fff; }
  .ticker-viewport { flex:1; overflow:hidden; position:relative; min-height:22px; display:flex; align-items:center; }
  .ticker-track { display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; transition: opacity .45s ease; }
  .ticker-item { display:inline-block; font-size:.88rem; color:var(--drop); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .ticker-item:hover { opacity:.8; }
  .ticker-ok { font-size:.85rem; color:var(--muted); }
  .ticker-nav { font-size:.76rem; color:var(--muted); white-space:nowrap; }

  h2 { font-size:1rem; margin:22px 0 8px; font-weight:600; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .hint { font-weight:400; font-size:.8rem; color:var(--muted); margin-left:4px; }
  .shoe-tag { font-size:.78rem; font-weight:500; padding:3px 9px; border-radius:999px; background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .shoe-tag:hover { border-color:var(--accent); color:var(--accent); }
  .shoe-tag.active { background:rgba(37,99,235,.1); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .date-input { border:1px solid var(--border); background:var(--card); color:var(--text); padding:4px 8px; border-radius:8px; font-size:.82rem; font-family:inherit; cursor:pointer; }
  .date-input:hover, .date-input:focus { border-color:var(--accent); outline:none; }
  .form-grid { display:grid; grid-template-columns: 110px 1fr; gap:10px 12px; align-items:center; font-size:.9rem; margin:12px 0; }
  .form-grid input, .form-grid select { border:1px solid var(--border); background:var(--bg); color:var(--text); padding:6px 10px; border-radius:8px; font-size:.9rem; width:100%; }
  .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }

  /* 每條產線：左邊 3 張感測點卡片，右邊 3 個小按鈕 (今日/昨日/本週) */
  .row { display:flex; gap:10px; align-items:stretch; }
  .grid { flex:1; min-width:0; display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .side { display:flex; flex-direction:column; gap:6px; justify-content:center; }
  .btn { border:1px solid var(--border); background:var(--card); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.82rem; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); }
  .btn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (max-width: 860px) {
    .row { flex-direction:column-reverse; }
    .side { flex-direction:row; justify-content:flex-start; }
    .grid { grid-template-columns: 1fr; }
  }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .sensor.alert { border-color: var(--drop); background: var(--alert-bg); }
  .sensor.off { opacity:.55; }
  .sensor .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .sensor .name { font-weight:600; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .sensor .flag { font-size:.8rem; color:var(--muted); white-space:nowrap; }
  .sensor.alert .flag, .sensor .flag.bad { color:var(--drop); font-weight:600; }
  .sensor .now-row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:2px 0; }
  .sensor .now { font-size:2.4rem; font-weight:600; line-height:1.15; font-variant-numeric: tabular-nums; }
  .sensor .alarm-bar { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .abtn { border:1px solid var(--border); background:var(--bg); color:var(--text); padding:3px 7px; border-radius:6px; cursor:pointer; font-size:.73rem; white-space:nowrap; }
  .abtn:hover { border-color:var(--accent); }
  .abtn:disabled { opacity:.5; cursor:wait; }
  .sensor .sub { font-size:.8rem; color:var(--muted); font-variant-numeric: tabular-nums; }
  .chartbox { position:relative; height:135px; margin-top:8px; }

  table { width:100%; border-collapse:collapse; font-size:.9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover { background:rgba(37,99,235,.06); }
  .empty { color:var(--muted); font-size:.9rem; padding:8px 0; }
  .scroll { overflow-x:auto; }

  /* 大曲線圖視窗 */
  dialog { width:min(1200px, 96vw); border:1px solid var(--border); border-radius:14px; padding:16px; background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .dhead { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:8px; }
  .dhead h3 { margin:0; font-size:1.1rem; flex:1; }
  .dhead .side { flex-direction:row; }
  .bigbox { position:relative; height:min(62vh, 560px); }
  .note { font-size:.8rem; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">成型產線溫度監控</h1>
    <div class="head-right">
      <div class="status" id="status">連線中…</div>
      <div class="rules" id="rules">標準 45~55°C · 警示 07:30~11:20、12:30~18:30（除外時段低溫不警示）</div>
    </div>
  </header>
  <div class="banner" id="banner">示範模式：目前顯示的是假資料，尚未連接塗鴉裝置。</div>

  <!-- 異常提示列：不連續快跑，每 8 秒平穩輪播一頁，點擊任一筆直接跳出對應產線的歷史大圖 -->
  <div class="ticker" id="ticker">
    <span class="ticker-badge" id="tickerBadge">正常</span>
    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack"><span class="ticker-ok">目前警示時段內無溫度異常</span></div>
    </div>
    <span class="ticker-nav" id="tickerNav"></span>
  </div>

  <div id="lines"></div>

  <h2>異常紀錄<span class="hint">僅列警示時段 (07:30~11:20、12:30~18:30) 內超出 45~55°C 或驟變，點擊可看曲線圖</span></h2>
  <div class="card scroll">
    <table id="anomalies" hidden>
      <thead><tr><th>時間</th><th>產線</th><th>感測點</th><th>異常原因</th><th>顯示值</th><th>該分鐘最低</th><th>該分鐘最高</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="noanom">今日警示時段內尚無異常。</div>
  </div>
</main>

<dialog id="big">
  <div class="dhead">
    <h3 id="bigTitle"></h3>
    <div class="side" id="bigRanges"></div>
    <input type="date" class="date-input" id="bigDate" title="選擇過去 90 天內任一日期查看 07:00~19:00 溫度曲線">
    <button class="btn" id="bigClose">✕ 關閉</button>
  </div>
  <div class="bigbox"><canvas id="bigChart"></canvas></div>
  <div class="note" id="bigNote"></div>
</dialog>

<dialog id="shoeDlg" style="width:min(460px, 94vw)">
  <div class="dhead">
    <h3 id="shoeDlgTitle">設定生產鞋型與溫度標準</h3>
    <button class="btn" id="shoeDlgClose">✕</button>
  </div>
  <div class="form-grid">
    <label>快速套用配方</label>
    <select id="shoeSelect"><option value="">— 手動輸入或選擇已存鞋型 —</option></select>
    <label>目前生產鞋型</label>
    <input type="text" id="shoeNameInput" placeholder="例如：Nike-Air-01（留空代表預設標準）">
    <label>標準下限 (°C)</label>
    <input type="number" step="0.5" id="shoeMinInput" value="45">
    <label>標準上限 (°C)</label>
    <input type="number" step="0.5" id="shoeMaxInput" value="55">
    <label>綁定 RFID 卡號</label>
    <div style="display:flex;gap:6px">
      <input type="text" id="shoeCardInput" placeholder="選填，刷卡機讀到的卡號">
      <button class="btn" type="button" id="useLastCardBtn" title="填入讀卡機最近一次刷到的卡號">帶入剛刷的卡</button>
    </div>
  </div>
  <div class="note" id="lastRfidNote">提示：設定後，該產線的上下限紅虛線與警報門檻會立即更新，並自動存入常用鞋型配方。</div>
  <div class="form-actions">
    <button class="btn" type="button" id="shoeResetBtn">恢復預設 (45~55°C)</button>
    <button class="btn on" type="button" id="shoeSaveBtn">儲存並套用</button>
  </div>
</dialog>

<script>
const REFRESH_MS = 30000;
const ALERT_WINDOW_MS = 5 * 60000;    // 最近 5 分鐘內有異常 → 卡片標紅
const RANGES = [['today', '今日'], ['yesterday', '昨日'], ['week', '本週']];
const cards = {};                     // 感測點 id → 卡片元素與圖表
const lineEls = {};                   // 產線 id → 鞋型標籤元素
const big = { lineId: null, range: 'today', date: '', chart: null, focusTs: null };
let latestData = null;

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pad = (n) => String(n).padStart(2, '0');
const hm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const full = (t) => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(t); };
const deg = (v) => (v == null ? '--' : v.toFixed(1) + ' °C');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const color = (i) => css('--s' + (i % 3));

// 伺服器回傳的點：[t, 顯示值, 最低, 最高, 異常碼(0 無 / 1 驟降 / 2 驟升 / 3 低於45°C / 4 高於55°C)]
const T = 0, V = 1, MIN = 2, MAX = 3, A = 4;
const isLowCode = (c) => c === 1 || c === 3;
const isHighCode = (c) => c === 2 || c === 4;
function anomText(code, minT = 45, maxT = 55) {
  if (code === 3) return `▼ 過低 (<${minT}°C)`;
  if (code === 4) return `▲ 過高 (>${maxT}°C)`;
  if (code === 1) return '▼ 驟降';
  if (code === 2) return '▲ 驟升';
  return '正常';
}

// 計算某天在工廠時區 (預設 UTC+7) 的指定時:分毫秒時間戳
function dayClock(baseTs, tzOffsetMin, hour, min) {
  const tzMs = (tzOffsetMin ?? 420) * 60000;
  const day0 = Math.floor((baseTs + tzMs) / 86400000) * 86400000 - tzMs;
  return day0 + (hour * 60 + min) * 60000;
}

// 判斷時間戳是否在警示時段 (07:30~11:20 或 12:30~18:30)
function isAlertClock(ts, tzOffsetMin) {
  const tzMs = (tzOffsetMin ?? 420) * 60000;
  const m = Math.floor(((ts + tzMs) % 86400000) / 60000);
  return (m >= 450 && m <= 680) || (m >= 750 && m <= 1110);
}

// Chart.js 外掛：
// 1. beforeDraw：在非作業/休息時段 (07:30 以前、11:20~12:30 午休、18:30 以後) 鋪上極淺的淺灰色背景，並在下方座標軸旁標註「(休息)」
// 2. afterDraw：畫出 45°C 下限與 55°C 上限紅色虛線
const limitLinesPlugin = {
  id: 'limitLines',
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x) return;
    const minX = scales.x.min;
    const maxX = scales.x.max;
    if (!Number.isFinite(minX) || !Number.isFinite(maxX) || maxX - minX > 3 * 86400000) return; // 本週多日圖不畫單日色塊
    const tz = chart.options.plugins.limitLines?.tzOffsetMin ?? 420;
    const isBig = !!chart.options.plugins.limitLines?.big;
    const tzMs = tz * 60000;
    const day0 = Math.floor((minX + tzMs) / 86400000) * 86400000 - tzMs;
    const atMin = (m) => day0 + m * 60000;
    // 三個非作業時段：07:00~07:30 (預熱/未作業)、11:20~12:30 (午休)、18:30~19:00 (收工)
    const zones = [
      [atMin(7 * 60), atMin(7 * 60 + 30), '07:30前 (休息)'],
      [atMin(11 * 60 + 20), atMin(12 * 60 + 30), '11:20~12:30 (休息)'],
      [atMin(18 * 60 + 30), atMin(19 * 60), '18:30後 (休息)'],
    ];
    ctx.save();
    const restBg = css('--rest-bg') || 'rgba(148,163,184,0.13)';
    const mutedColor = css('--muted') || '#6b7684';
    for (const [zStart, zEnd, label] of zones) {
      const s = Math.max(zStart, minX);
      const e = Math.min(zEnd, maxX);
      if (e <= s) continue;
      const x1 = scales.x.getPixelForValue(s);
      const x2 = scales.x.getPixelForValue(e);
      ctx.fillStyle = restBg;
      ctx.fillRect(x1, chartArea.top, x2 - x1, chartArea.bottom - chartArea.top);
      // 在下方接近座標軸處標註「(休息)」
      if (x2 - x1 >= 26) {
        ctx.fillStyle = mutedColor;
        ctx.font = (isBig ? '11px ' : '9.5px ') + 'system-ui, sans-serif';
        ctx.textAlign = 'center';
        const text = isBig && x2 - x1 >= 78 ? label : '(休息)';
        ctx.fillText(text, (x1 + x2) / 2, chartArea.bottom - (isBig ? 7 : 4));
      }
    }
    ctx.restore();
  },
  afterDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const minT = chart.options.plugins.limitLines?.minTemp ?? 45;
    const maxT = chart.options.plugins.limitLines?.maxTemp ?? 55;
    const isBig = !!chart.options.plugins.limitLines?.big;
    ctx.save();
    ctx.strokeStyle = css('--limit') || '#ef4444';
    ctx.fillStyle = css('--limit') || '#ef4444';
    ctx.lineWidth = isBig ? 1.5 : 1;
    ctx.setLineDash([5, 4]);
    ctx.font = (isBig ? '12px ' : '10px ') + 'system-ui, sans-serif';
    for (const [val, label] of [[maxT, `上限 ${maxT}°C`], [minT, `下限 ${minT}°C`]]) {
      const y = scales.y.getPixelForValue(val);
      if (y >= chartArea.top && y <= chartArea.bottom) {
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
        if (isBig) ctx.fillText(label, chartArea.right - 62, y - 5);
      }
    }
    ctx.restore();
  },
};
Chart.register(limitLinesPlugin);

// 把點轉成 Chart.js 資料；資料中斷處插入 null 讓線斷開
function lineData(pts, stepMin) {
  const out = [];
  pts.forEach((p, i) => {
    if (i && p[T] - pts[i - 1][T] > stepMin * 150000) out.push({ x: p[T] - 1, y: null });
    out.push({ x: p[T], y: p[V], p });
  });
  return out;
}
const lineSet = (label, c, width) => ({ label, data: [], borderColor: c, backgroundColor: c, borderWidth: width, pointRadius: 0, pointHoverRadius: 4, tension: 0.15, spanGaps: false });
const tipLabel = (it) => { const p = it.raw.p; return p ? `${it.dataset.label} ${p[V].toFixed(1)} °C（${anomText(p[A])}，最低 ${p[MIN].toFixed(1)} – 最高 ${p[MAX].toFixed(1)}）` : ''; };

function makeChart(canvas, datasets, opts) {
  return new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: {
          type: 'linear',
          grid: { display: !!opts.big, color: css('--border') },
          ticks: {
            color: css('--muted'),
            maxTicksLimit: opts.big ? 13 : 6,
            callback: (v) => {
              if (big.range === 'week' && opts.big) return full(v);
              const t = hm(v);
              if (opts.big && (t === '11:30' || t === '11:45' || t === '12:00' || t === '12:15')) return t + ' (休息)';
              return t;
            },
          },
        },
        y: {
          min: 20,
          max: 65,
          grid: { color: css('--border') },
          ticks: { color: css('--muted'), stepSize: opts.big ? 5 : 15, callback: (v) => v + '°' },
        },
      },
      plugins: {
        limitLines: { minTemp: 45, maxTemp: 55, big: !!opts.big },
        legend: { display: !!opts.big, labels: { color: css('--text'), usePointStyle: true, filter: (item) => item.datasetIndex < 3 } },
        tooltip: { callbacks: { title: (items) => full(items[0].raw.x), label: tipLabel } },
      },
    },
  });
}

function build(d) {
  $('lines').innerHTML = d.lines.map((line) =>
    `<h2><span>${esc(line.name)}</span>` +
      `<button class="shoe-tag" id="shoe-${esc(line.id)}" data-shoe-line="${esc(line.id)}" title="點擊設定此產線目前生產的鞋型與溫度上下限（或由 RFID 刷卡自動切換）"></button>` +
    `</h2><div class="row"><div class="grid">` + line.sensors.map((s, i) =>
      `<div class="card sensor" id="c-${s.id}">
         <div class="top"><span class="name"><span class="dot" style="background:var(--s${i % 3})"></span>${esc(s.name)}</span><span class="flag"></span></div>
         <div class="now-row">
           <div class="now">--</div>
           <div class="alarm-bar" ${s.configured ? '' : 'hidden'}>
             <button class="abtn" data-alarm="beep" data-sensor="${esc(s.id)}" title="讓現場溫度計連續響 3 聲 (約 3.5 秒) 後自動停，並進入 30 分鐘冷卻">🔔 響3聲</button>
             <button class="abtn" data-alarm="mute" data-sensor="${esc(s.id)}" title="強制解除現場溫度計警報並靜音 30 分鐘">🔕 靜音</button>
           </div>
         </div>
         <div class="sub"></div>
         <div class="chartbox"><canvas></canvas></div>
       </div>`).join('') +
    `</div><div class="side" title="開啟 ${esc(line.name)} 的大曲線圖">` +
      RANGES.map(([r, label]) => `<button class="btn" data-line="${esc(line.id)}" data-range="${r}">${label}</button>`).join('') +
      `<button class="btn" data-line="${esc(line.id)}" data-range="pickdate" title="選擇過去 90 天內任一日期">📅 查日期</button>` +
    `</div></div>`).join('');
  for (const line of d.lines) {
    lineEls[line.id] = $('shoe-' + line.id);
    line.sensors.forEach((s, i) => {
      const el = $('c-' + s.id);
      const chart = makeChart(el.querySelector('canvas'), [lineSet('溫度', color(i), 1.8)], {});
      cards[s.id] = { el, flag: el.querySelector('.flag'), now: el.querySelector('.now'), sub: el.querySelector('.sub'), chart };
    });
  }
  $('bigRanges').innerHTML = RANGES.map(([r, label]) => `<button class="btn" data-range="${r}">${label}</button>`).join('');
}

let tickerItems = [];
let tickerPage = 0;
let tickerPaused = false;
const TICKER_PAGE_SIZE = 2; // 每次停住顯示 2 筆，每 8 秒平穩換下一組，不連續橫向快跑

function drawTickerPage() {
  const track = $('tickerTrack');
  const nav = $('tickerNav');
  if (!tickerItems.length) {
    track.innerHTML = '<span class="ticker-ok">目前今日警示時段 (07:30~11:20、12:30~18:30) 內無溫度異常</span>';
    nav.textContent = '';
    return;
  }
  const pages = Math.ceil(tickerItems.length / TICKER_PAGE_SIZE);
  tickerPage = tickerPage % pages;
  const slice = tickerItems.slice(tickerPage * TICKER_PAGE_SIZE, (tickerPage + 1) * TICKER_PAGE_SIZE);
  track.innerHTML = slice.map(({ p, lineId, line, sensor, minT, maxT }) =>
    `<span class="ticker-item" data-line="${esc(lineId)}" data-ts="${p[T]}" title="點擊查看 ${esc(line)} 歷史曲線">` +
      `[${hm(p[T])}] ${esc(line)} - ${esc(sensor)}：${anomText(p[A], minT, maxT)} (${p[V].toFixed(1)}°C)` +
    `</span>`
  ).join('');
  nav.textContent = pages > 1 ? `${tickerPage + 1} / ${pages}（點擊查看圖表）` : '點擊查看圖表';
}

function renderTicker(anomalies, minT, maxT) {
  const box = $('ticker');
  const badge = $('tickerBadge');
  tickerItems = anomalies.slice(0, 20).map((x) => ({ ...x, minT, maxT }));
  tickerPage = 0;
  if (!tickerItems.length) {
    box.classList.remove('has-alert');
    badge.textContent = '正常';
  } else {
    box.classList.add('has-alert');
    badge.textContent = `⚠ 異常 (${anomalies.length})`;
  }
  drawTickerPage();
}

$('ticker').addEventListener('mouseenter', () => { tickerPaused = true; });
$('ticker').addEventListener('mouseleave', () => { tickerPaused = false; });
setInterval(() => {
  if (!tickerPaused && tickerItems.length > TICKER_PAGE_SIZE) {
    tickerPage++;
    drawTickerPage();
  }
}, 8000);

function render(d) {
  latestData = d;
  if (!Object.keys(cards).length) build(d);
  $('title').textContent = d.title;
  document.title = d.title;
  $('banner').style.display = d.mock ? 'block' : 'none';

  const minT = d.minTemp ?? 45;
  const maxT = d.maxTemp ?? 55;
  const tz = d.tzOffsetMin ?? 420;
  // 基本溫度圖表固定展示今日 07:30 ~ 18:00
  const cardMinX = dayClock(d.serverTime, tz, 7, 30);
  const cardMaxX = dayClock(d.serverTime, tz, 18, 0);
  const inAlertNow = isAlertClock(d.serverTime, tz);

  const anomalies = [];
  let staleCount = 0;
  for (const line of d.lines) {
    const lMin = line.minTemp ?? minT;
    const lMax = line.maxTemp ?? maxT;
    const shoeBtn = lineEls[line.id];
    if (shoeBtn) {
      shoeBtn.classList.toggle('active', !!line.shoeName);
      shoeBtn.textContent = line.shoeName
        ? `👟 鞋型：${line.shoeName} (${lMin}~${lMax}°C) ✎`
        : `👟 設定鞋型 (${lMin}~${lMax}°C) ✎`;
    }
    for (const s of line.sensors) {
      const c = cards[s.id];
      if (!c) continue;
      const sMin = s.minTemp ?? lMin;
      const sMax = s.maxTemp ?? lMax;
      const pts = s.points;
      const recent = pts.filter((p) => p[A] && d.serverTime - p[T] <= ALERT_WINDOW_MS).pop();
      const curVal = s.latest ? s.latest.v : null;
      const curOut = inAlertNow && curVal != null && (curVal < sMin || curVal > sMax);
      const isAlert = !!recent || curOut;

      c.el.classList.toggle('off', !s.configured);
      c.el.classList.toggle('alert', isAlert);
      c.flag.className = 'flag' + (s.stale || isAlert ? ' bad' : '');
      c.flag.textContent = !s.configured
        ? '尚未設定裝置'
        : s.stale
        ? '⚠ 資料中斷'
        : recent
        ? `${anomText(recent[A], sMin, sMax)} ${hm(recent[T])}`
        : curOut
        ? (curVal < sMin ? `▼ 過低 (<${sMin}°C)` : `▲ 過高 (>${sMax}°C)`)
        : inAlertNow
        ? '正常'
        : '非警示時段';
      if (s.stale) staleCount++;
      c.now.textContent = deg(curVal);

      // 卡片小圖只畫 07:30 ~ 18:00 之間的點位
      const cardPts = pts.filter((p) => p[T] >= cardMinX && p[T] <= cardMaxX);
      const coolMin = s.alarmCooldownMin || 30;
      const alarmNote = s.lastAlarmAt && d.serverTime - s.lastAlarmAt < coolMin * 60000
        ? ` · 🔔 ${hm(s.lastAlarmAt)} 已響 (${coolMin}分後再提醒)`
        : '';
      c.sub.textContent = (cardPts.length
        ? `07:30~18:00 最低 ${Math.min(...cardPts.map((p) => p[MIN])).toFixed(1)} ／ 最高 ${Math.max(...cardPts.map((p) => p[MAX])).toFixed(1)} °C`
        : pts.length
        ? `今日 最低 ${Math.min(...pts.map((p) => p[MIN])).toFixed(1)} ／ 最高 ${Math.max(...pts.map((p) => p[MAX])).toFixed(1)} °C`
        : '今日尚無資料 (07:00 開始記錄)') + alarmNote;

      c.chart.options.plugins.limitLines.minTemp = sMin;
      c.chart.options.plugins.limitLines.maxTemp = sMax;
      c.chart.options.plugins.limitLines.tzOffsetMin = tz;
      c.chart.data.datasets[0].data = lineData(cardPts, d.stepMin);
      c.chart.options.scales.x.min = cardMinX;
      c.chart.options.scales.x.max = cardMaxX;
      c.chart.update();
      for (const p of pts) if (p[A]) anomalies.push({ p, lineId: line.id, line: line.name, sensor: s.name, minT: sMin, maxT: sMax });
    }
  }

  const st = $('status');
  st.className = 'status' + (staleCount ? ' bad' : '');
  st.textContent = (staleCount ? `⚠ ${staleCount} 個感測點資料中斷 · ` : '') + '更新於 ' + hm(d.serverTime);

  anomalies.sort((a, b) => b.p[T] - a.p[T]);
  renderTicker(anomalies, minT, maxT);

  $('anomalies').hidden = !anomalies.length;
  $('noanom').hidden = !!anomalies.length;
  $('anomalies').querySelector('tbody').innerHTML = anomalies.slice(0, 100).map(({ p, lineId, line, sensor }) =>
    `<tr class="clickable" data-line="${esc(lineId)}" data-ts="${p[T]}" title="點擊開啟 ${esc(line)} 歷史曲線圖">` +
      `<td>${full(p[T])}</td><td>${esc(line)}</td><td>${esc(sensor)}</td>` +
      `<td style="color:var(--drop);font-weight:600">${esc(anomText(p[A], minT, maxT))}</td>` +
      `<td>${deg(p[V])}</td><td>${deg(p[MIN])}</td><td>${deg(p[MAX])}</td>` +
    `</tr>`).join('');
}

// ---- 大曲線圖：一條產線的 3 個感測點畫在同一張圖 (今日 / 昨日 / 指定日期 固定 07:00~19:00；本週顯示週一至週日) ----
function renderBig(d) {
  const line = d.lines[0];
  if (!line) return;
  const rItem = RANGES.find(([r]) => r === big.range);
  const label = big.range === 'date' && big.date ? big.date : (rItem ? rItem[1] : '今日');
  const minT = line.minTemp ?? d.minTemp ?? 45;
  const maxT = line.maxTemp ?? d.maxTemp ?? 55;
  const shoeTxt = line.shoeName ? ` · 鞋型：${line.shoeName}` : '';
  $('bigTitle').textContent = `${line.name}${shoeTxt} — ${label}（07:00 ~ 19:00）`;
  $('bigNote').textContent = `紅虛線：標準範圍 ${minT}~${maxT}°C　｜　警示時段：07:30~11:20、12:30~18:30　｜　歷史紀錄保存 ${d.retainDays || 90} 天　｜　滑鼠移到曲線上可查看每分鐘溫度（${d.stepMin > 1 ? `每 ${d.stepMin} 分鐘一點` : '每分鐘一點'}）`;
  [...$('bigRanges').children].forEach((b) => b.classList.toggle('on', b.dataset.range === big.range));
  $('bigDate').value = big.range === 'date' ? big.date : '';
  if (!big.chart) {
    const sets = [];
    for (let i = 0; i < 3; i++) sets.push(lineSet('', color(i), 2));
    big.chart = makeChart($('bigChart'), sets, { big: true });
  }
  big.chart.options.plugins.limitLines.minTemp = minT;
  big.chart.options.plugins.limitLines.maxTemp = maxT;
  big.chart.options.plugins.limitLines.tzOffsetMin = d.tzOffsetMin ?? 420;
  const ds = big.chart.data.datasets;
  for (let i = 0; i < 3; i++) {
    const s = line.sensors[i];
    const pts = s ? s.points : [];
    ds[i].label = s ? s.name : '';
    ds[i].data = lineData(pts, d.stepMin);
  }
  big.chart.options.scales.x.min = d.since;
  big.chart.options.scales.x.max = d.until;
  big.chart.update();
}

async function refreshBig() {
  if (!big.lineId || !$('big').open) return;
  try {
    const q = big.range === 'date' && big.date ? `date=${encodeURIComponent(big.date)}` : `range=${encodeURIComponent(big.range)}`;
    const r = await fetch(`/api/readings?${q}&line=${encodeURIComponent(big.lineId)}`, { cache: 'no-store' });
    renderBig(await r.json());
  } catch (e) { /* 主畫面的狀態列會顯示連線問題 */ }
}

function todayIso() {
  const tz = (latestData?.tzOffsetMin ?? 420) * 60000;
  return new Date((latestData?.serverTime || Date.now()) + tz).toISOString().slice(0, 10);
}

function openBig(lineId, range, dateStr = '') {
  big.lineId = lineId;
  if (range === 'pickdate') {
    big.range = 'date';
    big.date = dateStr || $('bigDate').value || todayIso();
    $('bigDate').value = big.date;
  } else if (range === 'date') {
    big.range = 'date';
    big.date = dateStr || todayIso();
    $('bigDate').value = big.date;
  } else {
    big.range = range || 'today';
    big.date = '';
    $('bigDate').value = '';
  }
  if (!$('big').open) $('big').showModal();
  refreshBig();
  if (range === 'pickdate' && $('bigDate').showPicker) {
    setTimeout(() => { try { $('bigDate').showPicker(); } catch (e) {} }, 80);
  }
}

// ---- 鞋型與標準溫度設定視窗 (兼 RFID 卡號綁定) ----
let editingLineId = null;
function openShoeDlg(lineId) {
  editingLineId = lineId;
  const line = (latestData?.lines || []).find((l) => l.id === lineId);
  if (!line) return;
  $('shoeDlgTitle').textContent = `${line.name} — 設定生產鞋型與溫度標準`;
  $('shoeNameInput').value = line.shoeName || '';
  $('shoeMinInput').value = line.minTemp ?? latestData?.minTemp ?? 45;
  $('shoeMaxInput').value = line.maxTemp ?? latestData?.maxTemp ?? 55;
  $('shoeCardInput').value = line.cardUid || '';
  const catalog = latestData?.shoeCatalog || [];
  $('shoeSelect').innerHTML = '<option value="">— 手動輸入或選擇已存鞋型 —</option>' +
    catalog.map((c, idx) => `<option value="${idx}">${esc(c.name)} (${c.minTemp}~${c.maxTemp}°C${c.cardUid ? ' · 卡:' + esc(c.cardUid) : ''})</option>`).join('');
  const rfid = latestData?.lastRfid;
  $('lastRfidNote').textContent = rfid
    ? `最近一次讀卡機刷卡：卡號 ${rfid.cardUid}（${hm(rfid.at)}${rfid.matchedShoe ? ' → ' + rfid.matchedShoe : '，尚未綁定鞋型'}）`
    : '提示：設定後，該產線的上下限紅虛線與警報門檻會立即更新，並自動存入常用鞋型配方。';
  $('shoeDlg').showModal();
}

$('shoeSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  const item = (latestData?.shoeCatalog || [])[Number(idx)];
  if (!item) return;
  $('shoeNameInput').value = item.name;
  $('shoeMinInput').value = item.minTemp;
  $('shoeMaxInput').value = item.maxTemp;
  $('shoeCardInput').value = item.cardUid || '';
});
$('useLastCardBtn').addEventListener('click', () => {
  if (latestData?.lastRfid?.cardUid) $('shoeCardInput').value = latestData.lastRfid.cardUid;
  else alert('目前還沒有收到 RFID 讀卡機刷卡紀錄，請先刷一次卡或直接手填卡號。');
});
$('shoeDlgClose').addEventListener('click', () => $('shoeDlg').close());
$('shoeDlg').addEventListener('click', (e) => { if (e.target === $('shoeDlg')) $('shoeDlg').close(); });

async function saveLineShoe(shoeName, minTemp, maxTemp, cardUid) {
  if (!editingLineId) return;
  const btn = $('shoeSaveBtn');
  btn.disabled = true;
  try {
    await fetch('/api/preset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'setLine', line: editingLineId, shoeName, minTemp, maxTemp, cardUid }),
    });
    $('shoeDlg').close();
    await refresh();
  } finally {
    btn.disabled = false;
  }
}
$('shoeSaveBtn').addEventListener('click', () => {
  saveLineShoe($('shoeNameInput').value.trim(), Number($('shoeMinInput').value) || 45, Number($('shoeMaxInput').value) || 55, $('shoeCardInput').value.trim());
});
$('shoeResetBtn').addEventListener('click', () => {
  saveLineShoe('', 45, 55, '');
});

$('lines').addEventListener('click', async (e) => {
  const ab = e.target.closest('button[data-alarm]');
  if (ab) {
    const action = ab.dataset.alarm;
    const sensor = ab.dataset.sensor;
    const oldText = ab.textContent;
    ab.disabled = true;
    ab.textContent = action === 'beep' ? '發送中…' : '靜音中…';
    try {
      const r = await fetch(`/api/alarm?sensor=${encodeURIComponent(sensor)}&action=${encodeURIComponent(action)}`, { cache: 'no-store' });
      const res = await r.json();
      ab.textContent = res.ok ? (action === 'beep' ? '✓ 已響3聲' : '✓ 已靜音') : '失敗';
      setTimeout(() => { ab.textContent = oldText; ab.disabled = false; refresh(); }, 2000);
    } catch (err) {
      ab.textContent = '連線失敗';
      setTimeout(() => { ab.textContent = oldText; ab.disabled = false; }, 2000);
    }
    return;
  }
  const sb = e.target.closest('button[data-shoe-line]');
  if (sb) {
    openShoeDlg(sb.dataset.shoeLine);
    return;
  }
  const b = e.target.closest('button[data-line]');
  if (b) openBig(b.dataset.line, b.dataset.range);
});
$('bigRanges').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-range]');
  if (b) openBig(big.lineId, b.dataset.range);
});
$('bigDate').addEventListener('change', (e) => {
  if (e.target.value) openBig(big.lineId, 'date', e.target.value);
});
// 點擊上方跑馬燈或下方異常紀錄表 → 直接跳出該產線的歷史大圖
$('tickerTrack').addEventListener('click', (e) => {
  const item = e.target.closest('[data-line]');
  if (item) openBig(item.dataset.line, 'today');
});
$('anomalies').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-line]');
  if (row) openBig(row.dataset.line, 'today');
});
$('bigClose').addEventListener('click', () => $('big').close());
$('big').addEventListener('click', (e) => { if (e.target === $('big')) $('big').close(); });

async function refresh() {
  try {
    const r = await fetch('/api/readings?range=today', { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    $('status').className = 'status bad';
    $('status').textContent = '⚠ 無法連線到伺服器';
  }
  refreshBig();
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
